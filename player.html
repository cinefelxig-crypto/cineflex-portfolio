<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Now Playing | Cineflex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-dim: rgba(212,175,55,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Full-screen video container */
        .player-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .player-container iframe {
            width: min(100vw, calc(100vh * 9 / 16));
            height: min(100vh, calc(100vw * 16 / 9));
            max-width: 100vw;
            max-height: 100vh;
            border: none;
            display: block;
            filter: contrast(1.04) saturate(1.05) brightness(1.02);
        }

        /* Loading state */
        .loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(212,175,55,0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.2rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
        }

        /* Back button — top left */
        .back-btn {
            position: fixed;
            top: max(12px, env(safe-area-inset-top, 12px));
            left: 12px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-btn:hover, .back-btn:active {
            background: rgba(212,175,55,0.3);
            border-color: var(--gold);
            color: var(--gold);
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Title bar — bottom */
        .title-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom, 0px));
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0.3rem;
        }

        .title-badge {
            display: inline-block;
            font-size: 0.5rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #000;
            background: linear-gradient(135deg, var(--gold), #fff);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        .title-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .title-sub {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            font-weight: 300;
            font-style: italic;
        }

        /* Error state */
        .error-screen {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 200;
            text-align: center;
            padding: 2rem;
        }

        .error-screen.show {
            display: flex;
        }

        .error-screen h2 {
            color: var(--gold);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .error-screen p {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .error-screen a {
            color: #000;
            background: var(--gold);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Auto-hide controls after 3s */
        .controls-visible .back-btn,
        .controls-visible .title-bar {
            opacity: 1;
        }

        .controls-hidden .back-btn,
        .controls-hidden .title-bar {
            opacity: 0;
            transition: opacity 0.4s ease;
        }
    </style>
</head>
<body class="controls-visible">

    <!-- Loading -->
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <div class="loading-text">Loading Clip...</div>
    </div>

    <!-- Error -->
    <div class="error-screen" id="errorScreen">
        <h2>No clip selected</h2>
        <p>Head back to the vault to pick a clip.</p>
        <a href="vault.html">← Back to Vault</a>
    </div>

    <!-- Back Button -->
    <a href="vault.html" class="back-btn" id="backBtn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Back
    </a>

    <!-- Video -->
    <div class="player-container" id="playerContainer">
        <!-- iframe injected by JS -->
    </div>

    <!-- Title Bar -->
    <div class="title-bar" id="titleBar">
        <span class="title-badge">4K HDR</span>
        <span class="title-text" id="titleText"></span>
        <span class="title-sub" id="titleSub"></span>
    </div>

    <script>
        // ── Read URL params ──────────────────────
        const params = new URLSearchParams(window.location.search);
        const fileId = params.get('id');
        const title  = params.get('title') || 'Untitled Clip';
        const line   = params.get('line') || '';
        const num    = params.get('num') || '';

        const loadingScreen = document.getElementById('loadingScreen');
        const errorScreen   = document.getElementById('errorScreen');
        const playerContainer = document.getElementById('playerContainer');
        const titleText     = document.getElementById('titleText');
        const titleSub      = document.getElementById('titleSub');

        if (!fileId) {
            // No video ID — show error
            loadingScreen.classList.add('hidden');
            errorScreen.classList.add('show');
        } else {
            // Set title
            document.title = `${title} | Cineflex`;
            titleText.textContent = num ? `${num} — ${title}` : title;
            titleSub.textContent = line;

            // Create iframe
            const iframe = document.createElement('iframe');
            iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
            iframe.allow = 'autoplay; encrypted-media';
            iframe.allowFullscreen = true;
            iframe.style.opacity = '0';
            iframe.style.transition = 'opacity 0.5s ease';

            iframe.addEventListener('load', () => {
                // Hide loading, show video
                loadingScreen.classList.add('hidden');
                iframe.style.opacity = '1';
            });

            playerContainer.appendChild(iframe);

            // Fallback: if iframe doesn't load in 8s, hide spinner anyway
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                iframe.style.opacity = '1';
            }, 8000);
        }

        // ── Auto-hide controls after 4 seconds ──
        let hideTimeout;
        function showControls() {
            document.body.classList.remove('controls-hidden');
            document.body.classList.add('controls-visible');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                document.body.classList.remove('controls-visible');
                document.body.classList.add('controls-hidden');
            }, 4000);
        }

        // Show controls on tap/mouse move
        document.addEventListener('touchstart', showControls, { passive: true });
        document.addEventListener('mousemove', showControls);
        showControls(); // Initial show

        // ── Swipe right to go back ──────────────
        let touchStartX = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            const diff = e.changedTouches[0].clientX - touchStartX;
            // Swipe right from left edge (within 50px)
            if (touchStartX < 50 && diff > 80) {
                window.location.href = 'vault.html';
            }
        }, { passive: true });
    </script>
</body>
</html>
